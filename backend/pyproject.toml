[project]
name = "zero-trust-ai-backend"
version = "1.0.0"
description = "Adaptive Zero Trust AI Framework Backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.6",
    "pydantic==2.10.5",
    "pydantic[email]==2.10.5",
    "PyJWT==2.8.0",
    "cryptography>=43.0.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pyotp==2.9.0",
    "numpy==2.1.3",
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "python-dotenv==1.0.0",
    "joblib==1.3.2",
    "python-multipart==0.0.6",
    "aiosqlite>=0.20.0",
    "requests>=2.31.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
