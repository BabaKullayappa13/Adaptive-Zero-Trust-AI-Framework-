[project]
name = "zero-trust-ai-backend"
version = "1.0.0"
description = "Adaptive Zero Trust AI Framework Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "psycopg[binary]==3.1.12",
    "pydantic==2.5.0",
    "pydantic[email]==2.5.0",
    "PyJWT==2.8.1",
    "passlib[bcrypt]==1.7.4",
    "pyotp==2.9.0",
    "numpy==1.24.3",
    "scikit-learn==1.3.2",
    "pandas==2.1.3",
    "shap==0.43.0",
    "joblib==1.3.2",
    "python-multipart==0.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
